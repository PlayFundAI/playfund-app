<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PlayFund Zoom Background</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#004643;
    --green:#5BA888;
    --paper:#FFFFFF;
    --line:#E8EDEC;
    --ink-soft:#6B7280;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{width:1920px;height:1080px;overflow:hidden}

  .stage{
    position:relative;width:1920px;height:1080px;
    background:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  }
  /* Soft lift at the top-left so the flat fill doesn't read as a block of paint on camera. */
  .stage::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(1200px 820px at 14% 8%, rgba(255,255,255,0.075), rgba(255,255,255,0) 68%);
  }
  /* Two hairline rings in the lower right. Far enough out to stay clear of the speaker. */
  .rings{position:absolute;right:-320px;bottom:-400px;width:1400px;height:1400px}
  .rings div{
    position:absolute;border-radius:50%;border:1.5px solid rgba(91,168,136,0.26);
  }
  .rings .r1{inset:0}
  .rings .r2{inset:180px}
  .rings .r3{inset:360px;border-color:rgba(91,168,136,0.18)}

  .logo{
    position:absolute;left:96px;top:84px;
    font-family:'Anton',sans-serif;font-weight:400;
    font-size:62px;letter-spacing:0.02em;line-height:1;
    color:var(--paper);
  }
  .logo span{color:var(--green)}

  .url{
    position:absolute;right:96px;bottom:92px;
    font-size:21px;font-weight:600;letter-spacing:0.01em;
    color:rgba(255,255,255,0.42);
  }

  /* Light variant: paper canvas, ink wordmark, same geometry. */
  body.light .stage{background:var(--paper)}
  body.light .stage::before{
    background:radial-gradient(1200px 820px at 14% 8%, rgba(0,70,67,0.04), rgba(0,70,67,0) 68%);
  }
  body.light .rings div{border-color:rgba(0,70,67,0.10)}
  body.light .rings .r3{border-color:rgba(91,168,136,0.22)}
  body.light .logo{color:var(--ink)}
  body.light .url{color:var(--ink-soft);opacity:0.75}
</style>
</head>
<body>
  <div class="stage">
    <div class="rings"><div class="r1"></div><div class="r2"></div><div class="r3"></div></div>
    <div class="logo">PLAY<span>FUND</span></div>
    <div class="url">playfundai.com</div>
  </div>
</body>
</html>
