<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — PlayFund</title>
<!--
  Without this file Cloudflare Pages falls back to serving the marketing page
  (public/index.html) with a 200 for EVERY unmatched path — /worker/index.js,
  /CLAUDE.md, /pilot-prep-punchlist.md all returned 200 + 20682 bytes of
  marketing HTML. The source isn't exposed, but a 200 on those paths makes the
  publish-boundary check in the migration plan report a false failure, and it
  lets search engines index unlimited duplicate URLs.

  Safe to add: the app is at /app/ and routes on the query string, never the
  path (it only ever calls history.replaceState with the current pathname), so
  nothing in the product depends on the unmatched-path fallback.
-->
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#F4F7F6;color:#004643;
       font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;text-align:center;padding:24px;}
  h1{font-size:22px;margin:0 0 8px;}
  p{margin:0 0 20px;color:#4a6b66;font-size:15px;}
  a{color:#3D8A6A;}
</style>
</head>
<body>
<div>
  <h1>Page not found</h1>
  <p>That link doesn't lead anywhere.</p>
  <p><a href="/">Go to playfundai.com</a> &nbsp;·&nbsp; <a href="/app/">Open the app</a></p>
</div>
</body>
</html>
