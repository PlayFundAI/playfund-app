<!DOCTYPE html>
<!--
  Source for the site icon. The brand is a wordmark (PLAY in ink, FUND in
  green), which is unreadable at 16px, so the icon is its two initials in the
  same face and colours.

  Search engines and phones crop this to a circle, so the background runs to
  the edge and the letters stay inside the middle 60%.

  To regenerate: tools/favicon/build.sh
-->
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:100vw;height:100vw;overflow:hidden;background:#004643}
  div{width:100vw;height:100vw;display:flex;align-items:center;justify-content:center;
      font-family:'Anton',sans-serif;font-size:56vw;line-height:1;letter-spacing:0.02em;color:#fff}
  span{color:#5BA888}
</style></head>
<body><div>P<span>F</span></div></body></html>
